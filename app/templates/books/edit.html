{% extends "base.html" %}
{% from "_csrf.html" import csrf_token %}

{% block title %}Edit {{ book.title }} - Alima{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Metadata: {{ book.title }}</h1>
</div>

<form action="/books/{{ book.id }}/update-metadata" method="POST">
    {{ csrf_token(request) }}
    <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-input" value="{{ book.title }}">
        <small class="form-help">Leave empty to use original metadata</small>
    </div>

    <div class="form-group">
        <label class="form-label">Subtitle</label>
        <input type="text" name="subtitle" class="form-input" value="{{ book.subtitle or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label">Author</label>
        <input type="text" name="author" class="form-input" value="{{ book.author or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label">Narrator</label>
        <input type="text" name="narrator" class="form-input" value="{{ book.narrator or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label">Series</label>
        <input type="text" name="series" class="form-input" value="{{ book.series or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label">Series Position</label>
        <input type="text" name="series_position" class="form-input" value="{{ book.series_position or '' }}">
    </div>

    <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-input" rows="4">{{ book.description or '' }}</textarea>
    </div>

    <div class="form-group">
        <label class="form-label">Publisher</label>
        <input type="text" name="publisher" class="form-input" value="{{ book.publisher or '' }}">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/library/{{ book.id }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
