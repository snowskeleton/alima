{% extends "base.html" %}
{% from "_csrf.html" import csrf_token %}

{% block title %}Create Feed - Alima{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create RSS Feed</h1>
</div>

<style>
.filter-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    align-items: center;
}
.filter-row .filter-field { flex: 0 0 140px; }
.filter-row .filter-operator { flex: 0 0 160px; }
.filter-row .filter-value { flex: 1; }
.filter-row .btn { flex-shrink: 0; }
@media (max-width: 768px) {
    .filter-row {
        flex-wrap: wrap;
    }
    .filter-row .filter-field,
    .filter-row .filter-operator { flex: 1 1 45%; }
    .filter-row .filter-value { flex: 1 1 100%; }
}
</style>

<form action="/feeds/create" method="POST">
    {{ csrf_token(request) }}
    <div class="form-group">
        <label class="form-label">Feed Name</label>
        <input type="text" name="name" class="form-input" required>
    </div>

    <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-input" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label class="form-label">Feed Type</label>
        <select name="feed_type" id="feedType" class="form-input" required onchange="toggleFilterOptions()">
            <option value="smart">Smart Feed (Automatic)</option>
            <option value="manual">Manual Feed</option>
        </select>
    </div>

    <div id="filterOptions">
        <div class="form-group">
            <label class="form-label">Filters</label>
            <div id="filterRows"></div>
            <button type="button" class="btn btn-secondary btn-sm" onclick="addFilterRow()">+ Add Filter</button>
        </div>
        <input type="hidden" name="filters_json" id="filtersJson">
    </div>

    <div class="form-group">
        <label class="checkbox-label">
            <input type="checkbox" name="is_public" value="true" checked>
            Make feed public (accessible via RSS URL)
        </label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Feed</button>
        <a href="/feeds" class="btn btn-secondary">Cancel</a>
    </div>
</form>

<script>
const FILTER_FIELDS = [
    {value: 'author', label: 'Author'},
    {value: 'title', label: 'Title'},
    {value: 'series', label: 'Series'},
    {value: 'narrator', label: 'Narrator'},
    {value: 'publisher', label: 'Publisher'},
];
const FILTER_OPERATORS = [
    {value: 'contains', label: 'contains'},
    {value: 'not_contains', label: 'does not contain'},
    {value: 'is', label: 'is exactly'},
    {value: 'is_not', label: 'is not'},
];

function addFilterRow(field, operator, value) {
    const container = document.getElementById('filterRows');
    const row = document.createElement('div');
    row.className = 'filter-row';
    row.innerHTML = `
        <select class="form-input filter-field">
            ${FILTER_FIELDS.map(f => `<option value="${f.value}" ${f.value === (field || '') ? 'selected' : ''}>${f.label}</option>`).join('')}
        </select>
        <select class="form-input filter-operator">
            ${FILTER_OPERATORS.map(o => `<option value="${o.value}" ${o.value === (operator || '') ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
        <input type="text" class="form-input filter-value" placeholder="e.g. Brandon Sanderson" value="${value || ''}">
        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Remove</button>
    `;
    container.appendChild(row);
}

function collectFilters() {
    const rows = document.querySelectorAll('.filter-row');
    const filters = [];
    rows.forEach(row => {
        const field = row.querySelector('.filter-field').value;
        const operator = row.querySelector('.filter-operator').value;
        const value = row.querySelector('.filter-value').value.trim();
        if (value) {
            filters.push({field, operator, value});
        }
    });
    document.getElementById('filtersJson').value = filters.length > 0 ? JSON.stringify(filters) : '';
}

function toggleFilterOptions() {
    const feedType = document.getElementById('feedType').value;
    const filterOptions = document.getElementById('filterOptions');
    filterOptions.style.display = feedType === 'smart' ? 'block' : 'none';
}

// Collect filters before form submission
document.querySelector('form').addEventListener('submit', function() {
    collectFilters();
});

// Initialize on page load
toggleFilterOptions();
</script>
{% endblock %}
