site_name: Alima 2.0 Documentation
site_description: Audiobook library manager for Audible
site_author: Snow
site_url: https://yourdomain.com

repo_name: alima2.0
repo_url: https://github.com/yourusername/alima2.0

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - First Run: getting-started/first-run.md
  - User Guide:
    - Adding Audible Accounts: user-guide/audible-accounts.md
    - Managing Library: user-guide/library.md
    - Creating RSS Feeds: user-guide/rss-feeds.md
    - User Management: user-guide/users.md
    - Server Settings: user-guide/server-settings.md
  - API Reference:
    - Models: api/models.md
    - Services: api/services.md
    - Routers: api/routers.md
  - Development:
    - Project Structure: development/structure.md
    - Running Tests: development/testing.md
    - Contributing: development/contributing.md
