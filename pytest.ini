[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --strict-markers -m "not openapi_docs"
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

    fuzz: Schema-driven property tests (slower; deselect with -m "not fuzz")
    openapi_docs: Asserts the OpenAPI document declares every status code (known-failing; deselected by default)
